name: Sync Release to Dev

on:
  push:
    branches:
      - 'release/**'
      - main

jobs:
  sync-release-to-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RELEASE_SYNC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SYNC_SSH_KEY }}

      - name: Configure Git
        run: |
          git config user.name "release-sync"
          git config user.email "release-sync@users.noreply.github.com"

      - name: Merge release into dev
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$RELEASE_BRANCH"

          git merge --no-edit "origin/$RELEASE_BRANCH"

          git push origin dev
