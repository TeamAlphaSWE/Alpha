name: Sync Release Back to Dev

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Create sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          EXISTING_PR=$(gh pr list \
            --base dev \
            --head "$RELEASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base dev \
              --head "$RELEASE_BRANCH" \
              --title "Sync $RELEASE_BRANCH back to dev" \
              --body "Automatically syncs release fixes back into dev."
          else
            echo "Existing sync PR #$EXISTING_PR will include the new commits."
          fi
