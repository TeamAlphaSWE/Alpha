name: Sync Release to Dev

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create/update sync branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          SYNC_BRANCH="sync/${RELEASE_BRANCH//\//-}-to-dev"

          git checkout -B "$SYNC_BRANCH"
          git push --force origin "$SYNC_BRANCH"

          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"

      - name: Create or find sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base dev \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base dev \
              --head "$SYNC_BRANCH" \
              --title "Sync release changes to dev" \
              --body "Automatically syncs release branch changes back into dev."

            PR_NUMBER=$(gh pr list \
              --base dev \
              --head "$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --merge
